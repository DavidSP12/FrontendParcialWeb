<div class="container">
  <h1>Listado de Clínicas</h1>
  
  <div class="actions">
    <a routerLink="/nueva-clinica" class="btn-primary">Nueva Clínica</a>
  </div>

  <div *ngIf="loading()" class="loading">Cargando...</div>
  
  <div *ngIf="error()" class="error">{{ error() }}</div>

  <div *ngIf="!loading() && clinicas().length === 0" class="no-data">
    No hay clínicas registradas
  </div>

  <table *ngIf="!loading() && clinicas().length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Dirección</th>
        <th>Ciudad</th>
        <th>Teléfono</th>
        <th>Camas</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let clinica of clinicas()">
        <td>{{ clinica.id }}</td>
        <td>{{ clinica.nombre }}</td>
        <td>{{ clinica.direccion }}</td>
        <td>{{ clinica.ciudad }}</td>
        <td>{{ clinica.telefono }}</td>
        <td>{{ clinica.cantidadCamas }}</td>
        <td>
          <button (click)="deleteClinica(clinica.id)" class="btn-delete">
            Eliminar
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
